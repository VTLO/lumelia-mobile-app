name: Build Debug APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install deps
        run: npm ci || npm install

      - name: Build web (si présent)
        run: npm run build --if-present

      - name: Capacitor sync (si présent)
        run: |
          if [ -f capacitor.config.ts ] || [ -f capacitor.config.js ] || [ -f capacitor.config.json ]; then
            npx cap sync android
          else
            echo "Pas de Capacitor, on saute"
          fi

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      # Install Android SDK / build tools (required to build an Android APK).
      # Use an action that provisions the SDK. Example using the emulator-runner (it installs SDK components).
      - name: Setup Android SDK (install required build-tools & platforms)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          arch: x86_64
          force-avd-creation: false

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Assemble debug
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: lumelia-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
